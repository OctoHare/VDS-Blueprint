name: Build README from docs/index.md

on:
  workflow_dispatch:
  push:
    branches:
      - main # Замени на master, если главная ветка master
    paths:
      - 'docs/**'

jobs:
  build-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile README.md
        run: node .github/scripts/build.js

      - name: Commit and push updated README.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-build README.md from docs/index.md [skip ci]"
          file_pattern: "README.md"
