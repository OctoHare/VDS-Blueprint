name: Build README from docs/index.md

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions
  push:
    branches:
      - main # Замени на master, если твоя главная ветка называется master
    paths:
      - 'docs/**' # Срабатывает при любых изменениях в папке docs/

jobs:
  build-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает право боту делать commit и push в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile README.md
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function processIncludes(filePath) {
            let content = fs.readFileSync(filePath, "utf8");
            
            // 1. Очищаем неразрывные пробелы (из-за копипаста) и нормализуем переносы строк
            content = content.replace(/\u00a0/g, " ").replace(/\r\n/g, "\n");
            
            // 2. Ищем все теги <!-- include: ... --> с любыми пробелами
            const includeRegex = /<!--\s*include:\s*([^\s-->]+)\s*-->/gi;
            
            let matchCount = 0;
            content = content.replace(includeRegex, (match, rawIncludePath) => {
              matchCount++;
              // Нормализуем путь для любых ОС (заменяем \ на /)
              const includePath = rawIncludePath.replace(/\\/g, "/");
              const fullPath = path.resolve(process.cwd(), includePath);
              
              if (fs.existsSync(fullPath)) {
                console.log(`[OK] Подставили файл: ${includePath}`);
                return processIncludes(fullPath);
              } else {
                console.warn(`[WARN] Файл не найден: ${includePath} (абсолютный путь: ${fullPath})`);
                return `<!-- [ERROR: File not found: ${includePath}] -->`;
              }
            });
            
            if (filePath === "docs/index.md") {
              console.log(`Найдено совпадений include: ${matchCount}`);
            }
            
            return content;
          }

          console.log("=== Старт сборки ===");
          const compiledContent = processIncludes("docs/index.md");
          fs.writeFileSync("README.md", compiledContent, "utf8");
          console.log("=== README.md успешно обновлен ===");
          '

      - name: Commit and push updated README.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-build README.md from docs/index.md [skip ci]"
          file_pattern: "README.md"
