name: Build README from docs/index.md

on:
  push:
    branches:
      - main # Укажи master, если главная ветка называется master
    paths:
      - 'docs/**'

jobs:
  build-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile README.md
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function processIncludes(filePath) {
            let content = fs.readFileSync(filePath, "utf8");
            
            // Ищем конструкции <!-- include: путь/к/файлу.md -->
            const includeRegex = /<!--\s*include:\s*([^\s-->]+)\s*-->/g;
            
            content = content.replace(includeRegex, (match, includePath) => {
              const fullPath = path.resolve(process.cwd(), includePath);
              if (fs.existsSync(fullPath)) {
                // Рекурсивно подставляем, если внутри включаемого файла тоже есть include
                return processIncludes(fullPath);
              } else {
                console.warn(`[WARN] Файл не найден: ${includePath}`);
                return `<!-- [ERROR: File not found: ${includePath}] -->`;
              }
            });
            
            return content;
          }

          const compiledContent = processIncludes("docs/index.md");
          fs.writeFileSync("README.md", compiledContent, "utf8");
          console.log("README.md успешно собран!");
          '

      - name: Commit and push updated README.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-build README.md from docs/index.md [skip ci]"
          file_pattern: "README.md"
